<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--teal:#00857A;--dark:#00655D;--orange:#F58220;--green:#54B949;--sky:#82D3EB;--pink:#DF1D5C;--ink:#203b39;--muted:#667b79;--border:#dbe7e5;--bg:#f3f8f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.band{height:9px;background:linear-gradient(90deg,var(--teal),var(--green) 36%,var(--orange) 71%,var(--pink))}.shell{max-width:960px;margin:32px auto 65px;padding:0 18px}.top{background:white;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 14px 38px #1a514d0e}.header{padding:30px 35px}.logos{display:flex;gap:22px;align-items:center;min-height:42px}.logos img{max-height:52px;max-width:135px;object-fit:contain}.brand{font-size:.81rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--dark)}h1{font-size:clamp(1.65rem,4vw,2.45rem);line-height:1.17;margin:13px 0 7px;letter-spacing:-.035em}h2{font-size:1.45rem;line-height:1.2;margin:0 0 8px}.subtitle{color:var(--teal);font-weight:650;margin:0 0 15px}.intro{color:var(--muted);max-width:760px}.main{padding:28px 35px 35px}.progress-top{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-weight:650;margin-bottom:10px}.bar{height:7px;border-radius:8px;background:#dbece8;overflow:hidden}.bar>div{height:100%;background:var(--teal);transition:width .2s}.steps{display:flex;gap:4px;flex-wrap:wrap;margin:19px 0 26px}.step{background:#e9f2f0;color:#5a726e;border:0;border-radius:30px;padding:7px 10px;font-size:.78rem}.step.active{background:var(--dark);color:#fff}.step.done{background:#d9f2e3;color:var(--dark)}.section-head{margin:15px 0 25px}.section-head p{margin:0;color:var(--muted)}.field{border:1px solid var(--border);border-radius:15px;padding:20px;margin:16px 0;background:#fff}.field.invalid{border-color:#de6d82;background:#fffafb}.question{font-weight:680;display:block;margin:0 0 7px;line-height:1.45}.required{color:var(--pink)}.help{color:var(--muted);font-size:.85rem;margin:0 0 12px}.control{display:block;width:100%;border:1.5px solid #ccdeda;border-radius:10px;padding:11px 13px;outline:none;background:#fff;color:var(--ink);min-height:45px}.control:focus{border-color:var(--teal);box-shadow:0 0 0 3px #00857A18}textarea.control{resize:vertical;min-height:106px}.options{display:grid;gap:9px}.choice{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:.15s}.choice:has(input:checked){border-color:var(--teal);background:#edf8f5}.choice input{accent-color:var(--teal);width:17px;height:17px}.rating{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.rating button{background:white;border:1.5px solid #bfdad5;border-radius:10px;min-width:44px;height:44px;color:var(--dark);font-weight:750}.rating button.selected{background:var(--dark);border-color:var(--dark);color:white}.endlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;gap:16px;margin-top:8px}.endlabels span:last-child{text-align:right}.error{font-size:.82rem;color:#b62946;margin:9px 0 0}.notice{border-radius:12px;padding:12px 15px;background:#e9f7f2;color:var(--dark);font-size:.9rem;margin:16px 0}.notice.danger{background:#fff0f2;color:#aa2040}.consent{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);background:#f5fbf9;border-radius:13px;padding:18px;margin:25px 0}.consent input{accent-color:var(--teal);margin-top:5px;min-width:19px;min-height:19px}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:27px}.btn{border:0;border-radius:11px;padding:13px 23px;background:var(--teal);color:white;font-weight:750}.btn:hover{background:var(--dark)}.btn.secondary{background:#ecf4f1;color:var(--dark)}.review-section{margin:18px 0 25px;border:1px solid var(--border);border-radius:13px;padding:18px}.review-section h3{margin:0 0 13px;color:var(--dark)}.review-row{padding:10px 0;border-top:1px solid #ecf1ef;overflow-wrap:anywhere}.review-row b{display:block;font-size:.87rem}.review-row span{color:var(--muted)}.success{text-align:center;padding:55px 20px}.success .check{font-size:3.8rem;color:var(--green)}.footer{text-align:center;color:var(--muted);font-size:.79rem;margin:19px}.loader{padding:80px 15px;text-align:center;color:var(--dark)}
.searchable{position:relative}.searchable .control{padding-right:36px}.searchable .caret{position:absolute;right:14px;top:13px;pointer-events:none;color:var(--dark)}.search-list{position:absolute;z-index:12;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow:auto;background:white;border:1.5px solid var(--teal);border-radius:11px;box-shadow:0 12px 24px #124d4930;padding:5px;margin:0;list-style:none}.search-list li button{width:100%;border:0;border-radius:7px;text-align:left;padding:10px 12px;background:white;color:var(--ink)}.search-list li button:hover,.search-list li button:focus,.search-list li button.highlight{background:#e8f6f2}.search-none{padding:12px;color:var(--muted)}
@media(max-width:650px){.shell{margin:12px auto 32px;padding:0 10px}.header,.main{padding:22px 19px}.steps{display:none}.field{padding:15px}.rating button{min-width:39px;height:40px}.actions{gap:8px}.btn{padding:12px 16px}.logos{gap:10px}}
</style></head><body><div id="root"><div class="loader">Loading survey…</div></div>
<script type="text/babel">
const {useEffect,useState,useRef}=React;
const demo=typeof google==='undefined'||!google.script||!google.script.run;
function SearchableDropdown({id,options,value,onChange,placeholder,bad}){
 const [query,setQuery]=useState(value||''),[open,setOpen]=useState(false),[active,setActive]=useState(0);
 useEffect(()=>setQuery(value||''),[value]);
 const matches=options.filter(name=>name.toLocaleLowerCase().includes(query.trim().toLocaleLowerCase()));
 const choose=name=>{onChange(name);setQuery(name);setOpen(false);setActive(0);};
 const keyDown=e=>{if(e.key==='Escape'){setOpen(false);return;}if(e.key==='ArrowDown'){e.preventDefault();setOpen(true);setActive(i=>Math.min(i+1,Math.max(0,matches.length-1)));}if(e.key==='ArrowUp'){e.preventDefault();setActive(i=>Math.max(0,i-1));}if(e.key==='Enter'&&open&&matches.length){e.preventDefault();choose(matches[Math.min(active,matches.length-1)]);}};
 return <div className="searchable"><input id={id} className="control" role="combobox" aria-autocomplete="list" aria-expanded={open} aria-controls={id+'-list'} aria-invalid={!!bad} aria-describedby={bad?id+'-error':undefined} autoComplete="off" placeholder={placeholder||'Search and select…'} value={query} onFocus={()=>{setOpen(true);setActive(0)}} onBlur={()=>setOpen(false)} onKeyDown={keyDown} onChange={e=>{setQuery(e.target.value);onChange('');setOpen(true);setActive(0);}}/><span className="caret" aria-hidden="true">⌄</span>{open&&<ul id={id+'-list'} role="listbox" className="search-list">{matches.length?matches.map((name,i)=><li role="option" aria-selected={value===name} key={name}><button type="button" className={i===active?'highlight':''} onMouseDown={e=>e.preventDefault()} onClick={()=>choose(name)}>{name}</button></li>):<li className="search-none">No matching name. Contact the programme team if yours is missing.</li>}</ul>}</div>
}
function App(){
 const [payload,setPayload]=useState(null),[values,setValues]=useState({}),[step,setStep]=useState(0),[errors,setErrors]=useState({}),[consent,setConsent]=useState(false),[dupe,setDupe]=useState(null),[busy,setBusy]=useState(false),[receipt,setReceipt]=useState(null),[fatal,setFatal]=useState('');
 const checkSeq=useRef(0),topRef=useRef(null);
 useEffect(()=>{if(demo){setFatal('Open the deployed Google Apps Script web-app URL to load your live survey.');return;}google.script.run.withSuccessHandler(setPayload).withFailureHandler(e=>setFatal(e.message||String(e))).getFormConfig()},[]);
 const steps=payload?.steps||[],config=payload?.config||{},atReview=step===steps.length;
 const fields=steps.flatMap(s=>s.fields);
 const shown=f=>{if(!f.depends_on)return true;const i=String(f.depends_on).indexOf('=');if(i<0)return true;const parent=f.depends_on.slice(0,i).trim(),allowed=f.depends_on.slice(i+1).split('|').map(s=>s.trim()),value=values[parent];return Array.isArray(value)?value.some(x=>allowed.includes(x)):allowed.includes(String(value??''));};
 const update=(field,value)=>{
  // Clear any dependent answers that become hidden when an A answer changes.
  // This is recursive so nested dependencies are also handled.
  setValues(old=>{
    const next={...old,[field]:value};
    let changed=true;
    while(changed){
      changed=false;
      for(const f of fields){
        if(!f.depends_on || next[f.field_name]===undefined)continue;
        const i=String(f.depends_on).indexOf('=');if(i<0)continue;
        const parent=f.depends_on.slice(0,i).trim();
        const allowed=f.depends_on.slice(i+1).split('|').map(s=>s.trim());
        const parentValue=next[parent];
        const visible=Array.isArray(parentValue)?parentValue.some(x=>allowed.includes(String(x))):allowed.includes(String(parentValue??''));
        if(!visible){delete next[f.field_name];changed=true;}
      }
    }
    return next;
  });
  setErrors(e=>({...e,[field]:undefined}));
  if(field==='email'){setDupe(null);checkSeq.current++;}
};
 function validate(index){const err={};for(const f of steps[index].fields){if(!shown(f))continue;const val=values[f.field_name],empty=val===undefined||val===null||val===''||(Array.isArray(val)&&!val.length);if(f.required&&empty){err[f.field_name]='Please answer this question.';continue;}if(empty)continue;if(f.field_type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val))err[f.field_name]='Please enter a valid email address.';if(f.field_type==='number'&&(!/^\d+$/.test(String(val))||Number(val)>100000000))err[f.field_name]='Enter a non-negative whole number.';if(f.field_type==='checkbox'){const match=String(f.help||'').match(/up to\s+(\d+)/i);if(match&&val.length>Number(match[1]))err[f.field_name]='Select up to '+match[1]+'.';}}if(index===0&&dupe===true)err.email='This email has already submitted a response.';setErrors(err);return Object.keys(err).length===0;}
 function goNext(){if(!validate(step))return;setStep(x=>x+1);topRef.current?.scrollIntoView({behavior:'smooth'});}
 function back(){setStep(x=>Math.max(0,x-1));setErrors({});topRef.current?.scrollIntoView({behavior:'smooth'});}
 function checkEmail(email){const val=String(email||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val))return;const seq=++checkSeq.current;setDupe('checking');google.script.run.withSuccessHandler(r=>{if(seq!==checkSeq.current)return;setDupe(!!r.exists);if(r.exists)setErrors(e=>({...e,email:'This email has already submitted a response.'}));}).withFailureHandler(()=>{if(seq===checkSeq.current)setDupe('unavailable')}).checkDuplicate(val,'email');}
 function renderField(f){if(!shown(f))return null;const val=values[f.field_name],bad=errors[f.field_name],label=<label className="question" htmlFor={f.field_name}>{f.field_label} {f.required&&<span className="required" aria-label="required">*</span>}</label>;
  let control=null;const common={id:f.field_name,'aria-invalid':!!bad,'aria-describedby':bad?f.field_name+'-error':undefined};
  if(['text','email','tel','number','date'].includes(f.field_type))control=<input {...common} className="control" type={f.field_type} min={f.field_type==='number'?0:undefined} step={f.field_type==='number'?1:undefined} placeholder={f.placeholder||''} value={val??''} onChange={e=>update(f.field_name,e.target.value)} onBlur={f.field_type==='email'?e=>checkEmail(e.target.value):undefined}/>;
  else if(f.field_type==='searchable_select')control=<SearchableDropdown id={f.field_name} options={f.options} value={val||''} onChange={v=>update(f.field_name,v)} placeholder={f.placeholder} bad={bad}/>;
  else if(f.field_type==='textarea')control=<textarea {...common} className="control" placeholder={f.placeholder||''} value={val??''} onChange={e=>update(f.field_name,e.target.value)}/>;
  else if(['radio','checkbox'].includes(f.field_type))control=<div className="options" role="group" aria-label={f.field_label}>{f.options.map(opt=><label className="choice" key={opt}><input type={f.field_type} name={f.field_name} checked={f.field_type==='checkbox'?(val||[]).includes(opt):val===opt} onChange={e=>{if(f.field_type==='radio')update(f.field_name,opt);else update(f.field_name,e.target.checked?[...(val||[]),opt]:(val||[]).filter(x=>x!==opt))}}/><span>{opt}</span></label>)}</div>;
  else if(f.field_type==='scale'){const low=Number(f.scale_min),high=Number(f.scale_max);control=<div role="group" aria-label={f.field_label}><div className="rating">{Array.from({length:high-low+1},(_,i)=>low+i).map(n=><button type="button" key={n} className={Number(val)===n&&val!==undefined?'selected':''} aria-pressed={Number(val)===n&&val!==undefined} onClick={()=>update(f.field_name,n)}>{n}</button>)}</div><div className="endlabels"><span>{f.min_label}</span><span>{f.max_label}</span></div></div>}
  return <div className={'field '+(bad?'invalid':'')} key={f.field_id}>{label}{f.help&&<p className="help">{f.help}</p>}{control}{f.field_type==='email'&&dupe==='checking'&&<p className="help">Checking for an existing response…</p>}{f.field_type==='email'&&dupe==='unavailable'&&<p className="help">Duplicate check unavailable; it will be verified when you submit.</p>}{bad&&<p className="error" id={f.field_name+'-error'} role="alert">{bad}</p>}</div>
 }
 function submit(){for(let i=0;i<steps.length;i++){if(!validate(i)){setStep(i);topRef.current?.scrollIntoView({behavior:'smooth'});return;}}if(!consent){setErrors({consent:'Please confirm your consent before submitting.'});return;}if(dupe===true){setStep(0);setErrors({email:'This email has already submitted a response.'});return;}setBusy(true);setErrors({});const answers={_consent:true};fields.filter(shown).forEach(f=>{if(values[f.field_name]!==undefined)answers[f.field_name]=values[f.field_name];});google.script.run.withSuccessHandler(r=>{setBusy(false);setReceipt(r)}).withFailureHandler(e=>{setBusy(false);setErrors({submit:e.message||String(e)})}).submitForm(answers);}
 if(fatal)return <main className="shell"><div className="notice danger">{fatal}</div></main>;
 if(!payload)return <div className="loader">Loading your survey…</div>;
 return <main className="shell" ref={topRef}><div className="top"><div className="band"></div><header className="header"><div className="logos">{config.logo_dbf_url&&<img alt="Ducit Blue Foundation" src={config.logo_dbf_url}/>} {config.logo_ohs_url&&<img alt="One Health Society" src={config.logo_ohs_url}/>}</div><div className="brand">Ducit Blue Foundation × One Health Society</div><h1>{config.form_title}</h1><p className="subtitle">{config.form_subtitle}</p><p className="intro">{config.form_intro}</p></header><div className="main">{receipt?<section className="success"><div className="check">✓</div><h2>{config.success_title}</h2><p>{config.success_message}</p><p className="help">Reference ID: {receipt.response_id}</p>{receipt.email_warning&&<p className="notice">{receipt.email_warning}</p>}</section>:<><div className="progress-top"><span>{atReview?'Review your answers':'Step '+(step+1)+' of '+steps.length}</span><span>{Math.round((step/(steps.length+1))*100)}% completed</span></div><div className="bar"><div style={{width:((step+1)/(steps.length+1)*100)+'%'}}></div></div><nav className="steps" aria-label="Survey steps">{steps.map((s,i)=><span key={s.number} className={'step '+(i===step?'active':i<step?'done':'')}>{i+1}. {s.label}</span>)}<span className={'step '+(atReview?'active':'')}>Review</span></nav>{atReview?<><div className="section-head"><h2>Review your answers</h2><p>Please check your responses before submitting. Use Back to make changes.</p></div>{steps.map(s=><div className="review-section" key={s.number}><h3>{s.label}</h3>{s.fields.filter(shown).map(f=><div className="review-row" key={f.field_id}><b>{f.field_label}</b><span>{Array.isArray(values[f.field_name])?values[f.field_name].join('; '):(values[f.field_name]??'Not answered').toString()}</span></div>)}</div>)}<label className="consent"><input type="checkbox" checked={consent} onChange={e=>{setConsent(e.target.checked);setErrors(x=>({...x,consent:undefined}))}}/><span>{config.consent_text}</span></label>{errors.consent&&<p className="error" role="alert">{errors.consent}</p>}{errors.submit&&<div className="notice danger" role="alert">{errors.submit}</div>}<div className="actions"><button className="btn secondary" onClick={back}>← Back</button><button className="btn" disabled={busy||!consent} onClick={submit}>{busy?'Submitting…':'Submit survey ✓'}</button></div></>:<><div className="section-head"><h2>{steps[step].label}</h2><p>{step===0?'Your details are used to match programme records.':step===1?'Consider how you feel about your knowledge and skills today.':'Please reflect on the three months since the programme ended.'}</p></div>{steps[step].fields.map(renderField)}<div className="actions"><button className="btn secondary" onClick={back} disabled={step===0}>← Back</button><button className="btn" onClick={goNext} disabled={dupe==='checking'&&step===0}>Continue →</button></div></>}</>}</div></div><p className="footer">Cohort 4 · Programme monitoring, evaluation and learning</p></main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
